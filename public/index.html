<html>

<head>
  <title>WebSocket Client</title>
  <link rel="stylesheet" href="index.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="main.js" defer></script>
</head>

<body>
  <div id="app">

    <div class="phone-shell" ref="phoneShell" v-show="joined">
      <div class="phone-header">
        <svg height="100" width="100" xmlns="http://www.w3.org/2000/svg">
          <circle ref="status" cx="35" cy="35" r="10" fill="red" />
        </svg>
      </div>
      <!-- Messages -->
      <div ref="messages" id="chat-messages"></div>

      <!-- Input Bar -->
      <div id="input-area">
        <div id="user-text">
          <button class="mic-btn" id="mic-button" title="Voice input">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1.5 4v6a1.5 1.5 0 0 0 3 0V5a1.5 1.5 0 0 0-3 0zM6.5 10a.75.75 0 0 1 .75.75 4.75 4.75 0 0 0 9.5 0 .75.75 0 0 1 1.5 0 6.25 6.25 0 0 1-5.5 6.21V19h2a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5h2v-2.04A6.25 6.25 0 0 1 5.75 10.75.75.75 0 0 1 6.5 10z" />
            </svg>
          </button>
          <input type="text" v-model="userInput" @keyup.enter="sendMessage" id="user-input"
            placeholder="Type a message…" autocomplete="off" />
        </div>
        <button @click="sendMessage" id="send-button" title="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3.4 2.1 22 11.3a.8.8 0 0 1 0 1.4L3.4 21.9A.8.8 0 0 1 2.3 21l1.9-8.25L2.3 3A.8.8 0 0 1 3.4 2.1zm1.7 2.5 1.5 6.65h7.6a.75.75 0 0 1 0 1.5H6.6L5.1 19.4 20.1 12 5.1 4.6z" />
          </svg>
        </button>
      </div>
    </div>

    <div id="name-area" v-show="!joined">
      <h2 id="name-title">Welcome</h2>
      <p id="name-subtitle">Enter your name to join the chat</p>
      <input type="text" v-model="name" id="name-input" placeholder="Your name" autocomplete="off" />
      <button id="name-button" @click="joinChat">Join Chat</button>
    </div>

  </div>
</body>

</html>
